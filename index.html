<style>
:root{--bg:#f5f5f8;--card:#fff;--ink:#2a2937;--muted:#6b6a7b;--line:#e4e3ec;--soft:#f0eff5;--y:#ffc805;--y2:#fff4cc;--ok:#1f7a4a;--okb:#e3f4ea;--warn:#9a5600;--warnb:#fdf0dc;--blue:#2459b8;--blueb:#e6eefb;--red:#b3261e;--sh:0 1px 2px rgba(20,20,40,.06),0 4px 16px rgba(20,20,40,.05)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 'Fira Sans',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.top .in{max-width:1400px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:7px;background:var(--y);display:grid;place-items:center;color:var(--ink);font-style:normal;font-weight:700}
.logo small{display:block;font-weight:400;font-size:12px;opacity:.7}
.sbox{flex:1;position:relative;max-width:640px}
.sbox input{width:100%;border:0;border-radius:10px;padding:11px 14px 11px 40px;background:#fff;color:var(--ink);font-size:15px}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sbox kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px 'Fira Sans';border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}

.tbtn:hover{background:rgba(255,255,255,.08)}
.main{max-width:1400px;margin:auto;padding:20px;display:flex;flex-direction:column;gap:16px}

.st span{font-weight:500;font-size:13px}

table{width:100%;border-collapse:collapse}

mark{background:var(--y);color:var(--ink);border-radius:2px;padding:0 1px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--soft);padding:12px;font-weight:500;border-radius:0 0 12px 12px}
.empty{padding:40px;text-align:center;color:var(--muted)}

.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(20,20,40,.2)}

.dot.now{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 0 0 4px var(--okb)}
.gapnote{font-size:12.5px;color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:9px;padding:8px 12px}

.stp{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:4px}
.sp{display:flex;flex-direction:column;gap:2px;min-width:0}

.sp.d i{background:var(--y)}.sp.x i{background:var(--red)}.sp.x b{color:var(--red)}.sp.x span{color:var(--red);font-weight:600}.sp.c i{background:var(--ok)}.sp.p i{background:repeating-linear-gradient(90deg,var(--y) 0 6px,transparent 6px 10px)}

.sp.c b{color:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:0}
.kv dt{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--soft);border-radius:999px;padding:2px 10px}
.alert{border-radius:9px;padding:10px 12px;font-size:13px;color:var(--ink)!important}
.alert.ok{background:var(--okb)}.alert.w{background:var(--warnb)}.alert.i{background:var(--blueb)}
.lk{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500;margin:4px 4px 0 0}
.lk:hover{border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
/* ajuda */
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(20,20,35,.4);padding:16px}
.modal.open{display:grid}
.mbox{background:var(--card);border-radius:14px;max-width:720px;max-height:85vh;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.mbox h2{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.mbox p{font-size:13.5px;color:var(--muted)}.mbox p b{color:var(--ink)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;z-index:70;transition:transform .2s}
.toast.on{transform:translateX(-50%)}

 .top .in{flex-wrap:wrap;padding:10px 14px}.sbox{order:3;flex-basis:100%;max-width:none}.sbox kbd{display:none}

 .hide-m{display:none}
 thead{display:none}tbody tr{display:grid;grid-template-columns:1fr auto;padding:10px 14px;border-top:1px solid var(--line);gap:4px}
 td{border:0;padding:0}td.num{text-align:right}
 .dd select{max-width:150px}
}
.prop details{margin-top:10px}.prop summary{cursor:pointer;font-weight:500}.prop pre{white-space:pre-wrap;font:inherit;font-size:13px;line-height:1.5;background:var(--soft);padding:12px;border-radius:6px;margin:8px 0}.prop p.sub{margin-top:8px}.thermo{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;margin:8px 0;color:#222}.thermo .lamp{width:18px;height:18px;border-radius:50%;flex:none;background:var(--tc)}.th-v{--tc:#1f9d55;background:#e8f6ee}.th-a{--tc:#e0a800;background:#fff7dc}.th-r{--tc:#d33a2c;background:#fdeceb}.th-p{--tc:#6b6b7a;background:#eceaf0}.thermo span:not(.lamp){font-size:13px}.vt{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:0 0 12px;background:var(--card)}
.vt button{border:0;background:transparent;padding:6px 16px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.vt button.on{background:var(--ink);color:#fff}
#kb{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;align-items:flex-start}
.kc{flex:0 0 268px;background:var(--soft);border-radius:10px;display:flex;flex-direction:column;max-height:74vh;min-width:0}
.kh{padding:10px 12px 8px;border-top:4px solid var(--c);border-radius:10px 10px 0 0;display:flex;align-items:baseline;gap:8px}
.kh b{font-size:14px}.kh span{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kl{overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px}
.kd{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;font:inherit;color:inherit;box-shadow:var(--sh)}
.kd:hover{border-color:var(--ink)}
.kd .kn{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.kd .km{font-size:12px;color:var(--muted)}
.kd .kr{font-size:12px;line-height:1.35}

@media(max-width:640px){.kc{flex-basis:84vw}}
.vcw{margin-top:12px;border-top:1px solid #e4e3ec;padding-top:10px}.vct{font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#6b6a7b;margin-bottom:6px}.vc{background:#f6f5fa;border-radius:10px;padding:10px 12px;margin-bottom:8px}.vch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.vcp{font-size:12.5px;color:#6b6a7b;margin:4px 0 6px}.vc p{margin:6px 0;color:#2a2937}.vc li{color:#2a2937}.vc ul{margin:6px 0 0 18px;padding:0}.vc li{margin:3px 0}.fact.hl{background:#ece6fa}.fact.hl b{color:#4b3a8f}

function emailHtml(p,link,mapUrl){const x=p.pr,R=ROT[x.a],dias=R?14:x.dur,h=x.h;
 const hist=h.length>1?h.slice(0,-1).join(', ')+' e '+h[h.length-1]:h[0];
 const per=x.q?'Para '+x.q:'Para a melhor época dessa rota ('+x.aj+')';
 const art=(x.a==='Yellowstone'||x.a==='Rota dos Cânions'||x.a==='Islândia'||x.a==='Noruega')?'a ':'as ';
 const par=t=>'<p style="margin:0 0 14px">'+t+'</p>';
 const rows=R?R.map(r=>'<tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#8a4b2a;padding:10px 12px 10px 0;vertical-align:top;white-space:nowrap;border-top:1px solid #e6dfd6;"><b>'+ESC(r[0])+'</b></td><td style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#2b2b2b;padding:10px 0;border-top:1px solid #e6dfd6;"><b>'+ESC(r[1])+'</b><br>'+ESC(r[2])+'</td></tr>').join(''):'';
 const itin=R?'<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;margin:0 0 18px"><tr><td style="padding:0"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Delicate_Arch_in_Arches_NP_1.jpg?width=1200" width="600" alt="Delicate Arch, em Utah" style="display:block;width:100%;height:auto;"></td></tr><tr><td style="padding:14px 0 0"><img src="'+ESC(mapUrl&&mapUrl.trim()?mapUrl.trim():MAPSRC)+'" width="600" alt="Mapa do roteiro: Las Vegas, Zion, Bryce Canyon, Monument Valley e Grand Canyon" style="display:block;width:100%;height:auto;margin:0 0 14px;"><div style="font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8a4b2a;padding-bottom:6px;">Roteiro sugerido · '+dias+' dias'+(x.q?' · '+ESC(x.q):'')+'</div><table role="presentation" width="100%" cellpadding="0" cellspacing="0">'+rows+'</table></td></tr><tr><td style="padding:18px 0 0"><div style="font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8a4b2a;padding-bottom:6px;">O que você vai ver</div><table role="presentation" width="100%" cellpadding="0" cellspacing="0">'+GALR+'</table></td></tr></table>':'';
 const lk=link&&link.trim()?par('Se a ideia te animou, me chama ou marca um horário por aqui: <a href="'+ESC(link.trim())+'">'+ESC(link.trim())+'</a>'):par('Se a ideia te animou, me responde por aqui e a gente conversa por vídeo ou telefone, no horário que for melhor para você. [LINK DE AGENDAMENTO]');
 return '<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#222">'+
 par('Olá, '+ESC(x.nome)+',')+
 par('Aqui é '+(/a$/i.test(x.em.split(' ')[0])?'a ':'o ')+ESC(x.em.split(' ')[0])+', da Motorhome Trips. Estava olhando a sua história com a gente: '+ESC(hist)+'. Sempre de motorhome.')+
 par('Fiquei pensando em como seria levar esse mesmo jeito de viajar para um lugar bem diferente. '+ESC(per)+', separei para você '+art+'<b>'+ESC(x.a)+'</b>. Montei um esboço de '+dias+' dias, perto do que você costuma fazer.')+
 itin+
 par('Esse é só um esboço. A gente ajusta os dias, as paradas e o tamanho do motorhome ao seu ritmo e a quem for com você.')+
 lk+
 '<p style="margin:0 0 14px">Um abraço,<br>'+ESC(x.em)+'<br>Motorhome Trips</p>'+
 '<p style="margin:18px 0 0;font-size:12px;color:#777">Se você prefere não receber propostas de viagem, é só responder este e-mail e eu tiro você da lista.</p></div>'}
function emailPanel(p){const x=p.pr,w=el('div','emailp');let lk='';try{lk=localStorage.getItem('mht_link')||''}catch(e){}
 const b=el('button','lk gen','Gerar e-mail');w.appendChild(b);
 const box=el('div',null,'');box.style.display='none';w.appendChild(box);
 b.onclick=()=>{if(box.style.display==='block'){box.style.display='none';b.textContent='Gerar e-mail';return}
  box.style.display='block';b.textContent='Ocultar e-mail';
  box.innerHTML='<label class="sub">Link de agendamento <input type="url" placeholder="https://..." style="width:100%;margin:4px 0 8px;padding:6px"></label><label class="sub">Endereço público da imagem do mapa (opcional, recomendado para o Gmail) <input type="url" class="mapu" placeholder="https://..." style="width:100%;margin:4px 0 8px;padding:6px"></label><iframe style="width:100%;height:420px;border:1px solid #ddd;border-radius:6px;background:#fff"></iframe><div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>';
  const inp=box.querySelector('input'),fr=box.querySelector('iframe'),row=box.querySelector('.row');inp.value=lk;
  const im=box.querySelector('.mapu');let mu='';try{mu=localStorage.getItem('mht_map')||''}catch(e){}im.value=mu;const gen=()=>emailHtml(p,inp.value.trim(),im.value.trim());im.oninput=()=>{try{localStorage.setItem('mht_map',im.value)}catch(e){}draw()};
  const draw=()=>{fr.srcdoc='<body style="margin:0">'+gen()+'</body>'};draw();
  inp.oninput=()=>{try{localStorage.setItem('mht_link',inp.value)}catch(e){}draw()};
  const bt=(t,f)=>{const q=el('button','lk',t);q.onclick=f;row.appendChild(q)};
  bt('Copiar e-mail formatado',async()=>{const h=gen();try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob([emailTxt(p)],{type:'text/plain'})})]);toast('E-mail copiado, cole no Gmail')}catch(e){try{fr.contentWindow.getSelection().selectAllChildren(fr.contentDocument.body);fr.contentDocument.execCommand('copy');toast('E-mail copiado, cole no Gmail')}catch(e2){toast('Não foi possível copiar')}}});
  bt('Baixar .html',()=>{dl(new Blob(['<!doctype html><meta charset="utf-8">'+gen()],{type:'text/html'}),'proposta-'+norm(p.n).replace(/[^a-z0-9]+/g,'-')+'.html')});
  bt('Copiar só o texto',()=>navigator.clipboard.writeText(emailTxt(p)).then(()=>toast('Texto copiado'),()=>toast('Não foi possível copiar')));
 };return w}
function propCard(p){const x=p.pr,c=el('div','card prop');
 c.appendChild(el('h3',null,'Proposta de viagem <span class="badge" style="--c:#8a4b2a">'+esc(x.a)+'</span>'));
 if(x.neg)c.appendChild(el('div','alert w','<b>Melhor evitar abordar neste projeto.</b> O sentimento nas conversas do UChat é negativo. Só aborde se a equipe decidir caso a caso.'));
 if(x.lead||x.terc)c.appendChild(el('div','alert i','<b>Atenção ao contato.</b> '+(x.lead?'Parece líder de grupo ou agência. ':'')+(x.terc?'O contato do chat parece ser de terceiro, não do titular.':'')));
 c.appendChild(el('div','thermo th-'+x.th,'<span class="lamp"></span><div><b>'+x.tt+'</b><br><span>'+esc(x.td)+'</span></div>'));
 const kv=el('dl','kv'),ad=(a,b)=>{if(b)kv.appendChild(el('div',null,'<dt>'+a+'</dt><dd>'+esc(b)+'</dd>'))};
 ad('Roteiro sugerido',x.a+(x.aj?' ('+x.aj+')':''));
 ad('Segunda opção',x.b?x.b+' ('+x.bj+')':'');
 ad('Viagem mais provável',fmtMY(x.tdate));const ci=compraInfo(p);ad('Duração habitual',ci.dur?ci.dur+' dias':'');ad('Pessoas na viagem',ci.px?ci.px+' pessoas':'não informado');ad('Locadora e categoria habituais',ci.forn?ci.forn+(ci.veic?' · '+ci.veic:''):'');ad('Valor habitual',ci.val?'US$ '+ci.val.toLocaleString('pt-BR'):'');ad('Fecha cerca de',ci.fecha?fmtMY(ci.fecha):'');ad('Confiança da previsão',ci.conf+' (histórico de '+ci.n+' '+(ci.n>1?'viagens':'viagem')+')');
 ad('Índice de retorno',x.idx+' de 100, faixa '+x.tier);
 ad('Quem assina',x.em);
 ad('Satisfação da viagem anterior',x.sat);
 c.appendChild(kv);
 c.appendChild(el('p','sub',esc(x.why)));
 c.appendChild(el('p','sub',esc(x.mwhy.replace(/,? então enviar a proposta por volta de \S+\./,'.'))));
 c.appendChild(el('p','sub','Termômetro: vermelho por '+RED_D+' dias após a devolução, verde a partir de 6 meses antes da data provável de fechamento (viagem menos a antecedência de compra do cliente), amarelo antes disso.'));
 c.appendChild(el('p','sub',esc(x.pwhy)));
 const R=ROT[x.a];
 if(R){const d=el('details',null,'<summary>Roteiro de 14 dias</summary>'),k=el('dl','kv');R.forEach(r=>k.appendChild(el('div',null,'<dt>'+esc(r[0])+'</dt><dd><b>'+esc(r[1])+'</b><br>'+esc(r[2])+'</dd>')));d.appendChild(k);c.appendChild(d)}
 else c.appendChild(el('p','sub','O roteiro dia a dia desta rota ainda não foi montado.'));
 if(!x.neg)c.appendChild(emailPanel(p));
 c.appendChild(el('p','hint','Rascunho para revisão. A decisão sobre a oferta é dos especialistas. Coloque o link de agendamento antes de enviar.'));
 return c}

function exportRows(kind){const r=filtered();if(!r.length){toast('Nenhum resultado para exportar');return}
 const H=['Nome','Tipo','Etapa','Situação','Nº de viagens','1ª retirada','Última retirada','Última devolução','Último fechamento','Países','Distribuidores','Emissores','Janela de recompra','Canal UChat','Nome no UChat','Entrou no UChat','Última interação UChat','Tags UChat','Orçamento registrado','Vínculo','Vendas citadas no UChat','Última atividade','Proposta: roteiro','Proposta: 2ª opção','Proposta: viagem provável','Termômetro','Abordar a partir de','Índice de retorno','Evitar abordar','Retirada → devolução (por viagem)','Gasto total (US$)'];
 const rows=r.map(p=>{const T=p.t||[],L=T[T.length-1]||{},u=p.u||{};return [p.n,p.kind==='c'?'Cliente':'Contato',p.stage,p.sdetail||'',p.ntrips,T[0]?T[0].p:'',L.p||'',L.r||'',L.s||'',p.cs.join(' | '),p.ds.join(' | '),p.es.join(' | '),p.window||'',CH[u.ch]||u.ch||'',u.nm||'',u.first||'',u.last||'',(u.tags||[]).join(' | '),hasQ(p)?'Sim':'',(p.cf||'')+(hasAst(p)?' *':''),p.vf||'',p.last||'',p.pr?p.pr.a:'',p.pr?p.pr.b:'',p.pr?fmtMY(p.pr.tdate):'',p.pr?p.pr.tt:'',p.pr?(p.pr.th==='v'?'Agora':fmtMY(p.pr.gfrom)):'',p.pr?p.pr.idx:'',p.pr&&p.pr.neg?'Sim':'',(p.t||[]).map(t=>{const z=CIDK(p,t);return z?(z[0]||'?')+' → '+(z[1]||'?'):'sem cidade'}).join(' | '),p.hasSpend?Math.round(p.spend):'']});
 const stamp=DATA.gen+'_'+r.length;
 if(kind==='csv'||kind==='xls'){const q=v=>{v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  dl(new Blob(['\ufeff'+[H,...rows].map(x=>x.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'jornada-clientes_'+stamp+'.csv')}
 else if(false){const html='<html><head><meta charset="utf-8"></head><body><table><tr>'+H.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows.map(x=>'<tr>'+x.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table></body></html>';
  dl(new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'}),'jornada-clientes_'+stamp+'.xls')}
 else{navigator.clipboard.writeText([H,...rows].map(x=>x.map(v=>String(v).replace(/[\t\n]/g,' ')).join('\t')).join('\n')).then(()=>toast(r.length.toLocaleString('pt-BR')+' linhas copiadas'),()=>toast('Não foi possível copiar'));return}
 toast('Preparando '+r.length.toLocaleString('pt-BR')+' linhas')}
async function dl(b,n){try{const D=await (window.claude&&claude.use?claude.use('downloads'):null);if(D){try{await D.save({filename:n,data:b});toast('Arquivo salvo')}catch(e){toast(e&&e.code==='declined'?'Download cancelado':'Não foi possível salvar')}return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}

function notes(){const nc=ALL.filter(p=>p.kind==='c').length,ca=ALL.filter(p=>p.cf==='alta').length,cm=ALL.filter(p=>p.cf==='média').length,ci=ALL.filter(p=>p.cf==='indireto').length,na=ALL.filter(hasAst).length,nv=ALL.filter(p=>p.stage==='Cliente só no UChat').length,f=n=>n.toLocaleString('pt-BR'),np=ALL.filter(p=>p.pr).length,nn=ALL.filter(p=>p.pr&&p.pr.neg).length;
 $('#notes').innerHTML='<p><b>Viagens.</b> Vendas do Odoo com data de retirada, sem canceladas nem reemitidas. Vendas com até 45 dias entre uma retirada e a seguinte contam como uma só viagem. '+f(nc)+' clientes têm ao menos uma viagem.</p>'+
 '<p><b>Etapas.</b> Pré-viagem: fechou e ainda não retirou. Em viagem: entre retirada e devolução. Pós-viagem: até 30 dias depois da devolução. Reativação: mais de 30 dias. Contatos sem venda ficam em atendimento, finalizado ou "só no UChat" quando citam venda que não foi achada no Odoo.</p>'+
 '<p><b>Ligação com o UChat.</b> Pontos por telefone igual (DDD + 8 últimos dígitos), e-mail igual, nome e sobrenome em comum e datas de venda citadas no UChat que batem com o Odoo. Confiança alta exige telefone ou e-mail mais nome ou data. Hoje: '+f(ca)+' vínculos de confiança alta e '+f(cm)+' de confiança média ("vínculo a confirmar").</p>'+
 '<p><b>O asterisco (*).</b> Confiabilidade reduzida por motivo identificado: familiar ou acompanhante, contrato em nome de outra pessoa, organizador de grupo, agência, parceiro ou contato interno. São '+f(ci)+' vínculos indiretos e '+f(na)+' registros com asterisco.</p>'+
 '<p><b>Janela de recompra.</b> Entre 12 e 36 meses desde a última viagem: mediana de 1,5 ano entre viagens e três quartos dos retornos em até 3 anos.</p>'+
 '<p><b>Proposta de viagem (Reativação).</b> '+f(np)+' clientes em Reativação têm proposta do projeto de recorrência (clientes com 2 viagens ou mais): roteiro sugerido entre os 5 de referência, mês provável, momento de enviar, índice de retorno, quem assina e rascunho de e-mail. A decisão é dos especialistas. '+f(nn)+' deles têm sentimento negativo nas conversas e estão marcados para evitar abordagem. Os demais clientes em Reativação ainda não têm proposta.</p>'+
  '<p><b>Limites.</b> O UChat só tem conversas recentes, então clientes antigos geralmente não têm contato ligado. A data do pedido de orçamento não é registrada, só se houve pedido. '+f(nv)+' contatos citam vendas que não foram achadas no Odoo. O mesmo cliente com telefones e e-mails diferentes pode aparecer duas vezes.</p>'}

/* eventos */
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;go()},120)});
$('#clr').onclick=()=>{Object.keys(S).forEach(k=>{if(!['n','sel','sort','q'].includes(k))S[k]=null});S.q='';$('#q').value='';go()};
$('#xBtn').onclick=e=>{e.stopPropagation();const m=$('#xMenu'),o=!m.classList.contains('open');m.classList.toggle('open',o);$('#xBtn').setAttribute('aria-expanded',o)};
$('#xMenu').addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(b){$('#xMenu').classList.remove('open');exportRows(b.dataset.x)}});
document.addEventListener('click',e=>{if(!e.target.closest('.xp'))$('#xMenu').classList.remove('open')});
$('#scrim').onclick=closeP;
$('#help').onclick=()=>$('#modal').classList.add('open');$('#mx').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
document.addEventListener('keydown',e=>{const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
 if(e.key==='/'&&!typing){e.preventDefault();$('#q').focus()}
 else if(e.key==='Escape'){if($('#modal').classList.contains('open'))$('#modal').classList.remove('open');else if($('#drawer').classList.contains('open'))closeP();else if(typing)document.activeElement.blur()}
 else if($('#drawer').classList.contains('open')&&!typing){if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();step(-1)}}});
fillSelects();notes();$('#vL').onclick=()=>setView('l');$('#vK').onclick=()=>setView('k');go();
 openP(ALL[0]);document.title=ALL[0].n+' · Motorhome Trips';document.body.classList.add('cardmode');
})();</script></body></html>
